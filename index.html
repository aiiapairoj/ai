<style>
/* Layout: fullscreen WebGL office, HUD overlay (top bar, left Agent Team, right SOC, bottom log ticker) */
:root{--bg:#070B14;--fg:#E6ECF8;--muted:#8A96B3;--cyan:#22D3EE;--orange:#FB923C;--green:#4ADE80;--red:#F87171;--line:rgba(255,255,255,.09);--glass:rgba(10,16,30,.62);

#gl{position:fixed;inset:0;display:block;touch-action:none}

.top{top:env(safe-area-inset-top,0px);left:0;right:0;padding:12px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));display:flex;justify-content:space-between;gap:12px;align-items:center}
.brand{display:flex;align-items:center;gap:10px;padding:8px 14px;font-family:var(--display);font-weight:700}
.brand i{width:22px;height:22px;border-radius:6px;background:conic-gradient(from 200deg,var(--cyan),var(--orange),var(--cyan));box-shadow:0 0 14px var(--cyan)}
.brand small{font-family:var(--mono);font-weight:400;font-size:.68rem;color:var(--muted);margin-left:4px}
.cams{display:flex;gap:4px;padding:4px}
.cams button{font-family:var(--body);font-size:.78rem;color:var(--muted);background:transparent;border:0;padding:7px 12px;border-radius:10px;cursor:pointer;transition:.2s;white-space:nowrap}
.cams button.on,.cams button:hover{background:var(--cyan);color:#041018}

/* left: agents */
.left{left:max(16px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 72px);width:270px;padding:14px}
.h{font-family:var(--mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--orange);margin:0 0 10px;display:flex;justify-content:space-between}

.bar{height:3px;background:rgba(255,255,255,.08);border-radius:2px;margin-top:5px;overflow:hidden}

/* right: SOC */
.right{right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 72px);width:250px;padding:14px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.kpi b{display:block;font-family:var(--display);font-size:1.3rem;font-variant-numeric:tabular-nums;color:var(--cyan);line-height:1.1}
.kpi b.warn{color:var(--orange)}.kpi b.bad{color:var(--red)}.kpi b.ok{color:var(--green)}
.kpi span{font-size:.66rem;color:var(--muted)}
.threat{margin-top:10px;font-family:var(--mono);font-size:.68rem;color:var(--muted)}
.threat i{display:block;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--green),var(--orange),var(--red));margin-top:5px;position:relative}
.threat i::after{content:"";position:absolute;top:-4px;left:var(--p,30%);width:3px;height:14px;background:#fff;border-radius:2px;box-shadow:0 0 8px #fff;transition:left 1s}
/* bottom log */
.bottom{left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));padding:10px 14px;font-family:var(--mono);font-size:.7rem;max-height:110px;overflow:hidden}

.bottom .log div:first-child{color:var(--fg)}
.t{color:var(--cyan)}.ok{color:var(--green)}.wn{color:var(--orange)}.er{color:var(--red)}
.hint{position:fixed;z-index:4;left:50%;transform:translateX(-50%);bottom:calc(136px + env(safe-area-inset-bottom,0px));font-size:.72rem;color:var(--muted);pointer-events:none;font-family:var(--mono);opacity:.8}
.credit{position:fixed;z-index:5;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(136px + env(safe-area-inset-bottom,0px));font-size:.68rem;font-family:var(--mono)}

.tip{position:fixed;z-index:6;pointer-events:none;background:var(--glass);backdrop-filter:blur(12px);border:1px solid rgba(34,211,238,.4);border-radius:10px;padding:8px 12px;font-size:.78rem;transform:translate(-50%,-120%);opacity:0;transition:opacity .15s;white-space:nowrap}

@media (max-width:860px){.left,.right{width:200px}.right{display:none}.cams button{padding:6px 8px;font-size:.7rem}.brand small{display:none}.hint,.credit{display:none}}
@media (max-width:560px){.left{display:none}.bottom{max-height:70px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
(function(){
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const C={cyan:0x22D3EE,orange:0xFB923C,green:0x4ADE80,red:0xF87171,purple:0xA78BFA,pink:0xF472B6,yellow:0xFACC15};

/* ================= renderer / scene ================= */
const cv=document.getElementById('gl');
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,1.8));R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
const S=new THREE.Scene();S.background=new THREE.Color(0x070B14);S.fog=new THREE.FogExp2(0x070B14,.018);

Object.assign(key.shadow.camera,{left:-40,right:40,top:40,bottom:-40,far:80});S.add(key);
function neon(c,x,y,z,i,d){const l=new THREE.PointLight(c,i,d);l.position.set(x,y,z);S.add(l);return l}
neon(C.cyan,-14,7,0,1.4,30);neon(C.orange,0,8,-16,1.6,34);neon(C.purple,14,7,4,1.2,28);

/* ---------- floor + grid ---------- */
const floor=new THREE.Mesh(new THREE.PlaneGeometry(90,70),new THREE.MeshStandardMaterial({color:0x0C1222,roughness:.85,metalness:.2}));

lane(0,-2,.25,44,C.cyan);lane(0,-2,60,.25,C.cyan);

/* ---------- canvas textures ---------- */
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
const screens=[];
function codeScreen(w=512,h=320,hue='#7DD3FC'){
  const c=mkCanvas(w,h),g=c.getContext('2d');const tex=new THREE.CanvasTexture(c);
  const kw=['function','const','return','SELECT','WHERE','async','await','class','public','if','foreach','$pdo->prepare(','->execute(','import','=>','try','catch'];
  const lines=[];let t=0;
  function gen(){const n=4+Math.random()*7|0;let s='';for(let i=0;i<n;i++)s+=(Math.random()<.4?kw[Math.random()*kw.length|0]:Math.random().toString(36).slice(2,4+Math.random()*7|0))+' ';return s}
  for(let i=0;i<22;i++)lines.push(gen());
  const draw=()=>{t++;if(t%6===0){lines.shift();lines.push(gen())}
    g.fillStyle='#050912';g.fillRect(0,0,w,h);g.fillStyle='#0F1A2E';g.fillRect(0,0,w,22);g.fillStyle=hue;g.font='600 12px Prompt, sans-serif';g.fillText('● app/Controller.php  — agent editing',10,15);
    g.font='12px Prompt, sans-serif';lines.forEach((l,i)=>{g.fillStyle=i%5===0?'#FB923C':i%3===0?'#4ADE80':hue;g.globalAlpha=.55+.45*(i/lines.length);g.fillText((100+i).toString().padStart(3)+'  '+'  '.repeat(i%4)+l,8,40+i*13);});
    g.globalAlpha=1;if(t%20<10){g.fillStyle='#fff';g.fillRect(8+(((t*7)%30)*7),h-18,7,12)}tex.needsUpdate=true};
  screens.push(draw);draw();return tex}
function mapScreen(w=1024,h=512){
  const c=mkCanvas(w,h),g=c.getContext('2d');const tex=new THREE.CanvasTexture(c);const dots=[];for(let i=0;i<180;i++)dots.push([Math.random()*w,Math.random()*h*.8+h*.1,Math.random()]);
  const blips=[];let t=0;
  const draw=()=>{t++;g.fillStyle='#04070F';g.fillRect(0,0,w,h);g.strokeStyle='rgba(34,211,238,.12)';for(let x=0;x<w;x+=64){g.beginPath();g.moveTo(x,0);g.lineTo(x,h);g.stroke()}for(let y=0;y<h;y+=64){g.beginPath();g.moveTo(0,y);g.lineTo(w,y);g.stroke()}
    dots.forEach(d=>{g.fillStyle=d[2]<.1?'#FB923C':'#22D3EE';g.globalAlpha=.6;g.fillRect(d[0],d[1],3,3)});g.globalAlpha=1;
    if(t%25===0)blips.push({x:Math.random()*w,y:Math.random()*h,r:0,c:Math.random()<.3?'#F87171':'#22D3EE'});
    for(let i=blips.length-1;i>=0;i--){const b=blips[i];b.r+=2;g.strokeStyle=b.c;g.globalAlpha=1-b.r/60;g.lineWidth=2;g.beginPath();g.arc(b.x,b.y,b.r,0,7);g.stroke();if(b.r>60)blips.splice(i,1)}
    g.globalAlpha=1;g.fillStyle='#22D3EE';g.font='600 22px Prompt, sans-serif';g.fillText('GLOBAL THREAT MAP · BUGpairoj SOC',20,34);g.fillStyle='#8A96B3';g.font='14px Prompt, sans-serif';g.fillText('nodes: 180   live blips: '+blips.length+'   '+new Date().toLocaleTimeString('th-TH'),20,56);
    // sweep
    g.strokeStyle='rgba(74,222,128,.5)';g.lineWidth=3;const sx=(t*6)%w;g.beginPath();g.moveTo(sx,0);g.lineTo(sx,h);g.stroke();tex.needsUpdate=true};
  screens.push(draw);draw();return tex}
function chartScreen(title,color,w=512,h=320){
  const c=mkCanvas(w,h),g=c.getContext('2d');const tex=new THREE.CanvasTexture(c);const data=Array.from({length:60},()=>30+Math.random()*50);
  const draw=()=>{data.shift();data.push(Math.max(5,Math.min(95,data[data.length-1]+(Math.random()-.5)*20)));
    g.fillStyle='#04070F';g.fillRect(0,0,w,h);g.fillStyle=color;g.font='600 16px Prompt, sans-serif';g.fillText(title,14,26);g.fillStyle='#8A96B3';g.font='12px Prompt, sans-serif';g.fillText('now: '+data[data.length-1].toFixed(1)+'  avg: '+(data.reduce((a,b)=>a+b)/data.length).toFixed(1),14,46);
    g.strokeStyle='rgba(255,255,255,.08)';for(let y=70;y<h;y+=50){g.beginPath();g.moveTo(0,y);g.lineTo(w,y);g.stroke()}
    g.beginPath();data.forEach((v,i)=>{const x=i/(data.length-1)*w,y=h-20-v/100*(h-90);i?g.lineTo(x,y):g.moveTo(x,y)});g.strokeStyle=color;g.lineWidth=3;g.stroke();
    g.lineTo(w,h);g.lineTo(0,h);g.closePath();g.fillStyle=color;g.globalAlpha=.15;g.fill();g.globalAlpha=1;tex.needsUpdate=true};
  screens.push(draw);draw();return tex}
function logScreen(w=512,h=320){
  const c=mkCanvas(w,h),g=c.getContext('2d');const tex=new THREE.CanvasTexture(c);const L=[];const src=['fortigate','wazuh','nginx','mysql','auth','proxmox','veeam'];const msg=['login ok','rule 42 matched','policy deny 10.0.4.','backup job done','SSL VPN connect','cpu 71%','brute-force blocked','PDO prepared','snapshot ok','integrity check'];
  let t=0;const draw=()=>{t++;if(t%8===0){L.push({s:src[Math.random()*src.length|0],m:msg[Math.random()*msg.length|0],l:Math.random()<.12?'#F87171':Math.random()<.3?'#FB923C':'#4ADE80'});if(L.length>19)L.shift()}
    g.fillStyle='#04070F';g.fillRect(0,0,w,h);g.fillStyle='#22D3EE';g.font='600 14px Prompt, sans-serif';g.fillText('SIEM LOG STREAM',12,22);g.font='12px Prompt, sans-serif';
    L.forEach((e,i)=>{g.fillStyle=e.l;g.fillText('▸',12,46+i*14);g.fillStyle='#BFE8F2';g.fillText(e.s.padEnd(10)+e.m,28,46+i*14)});tex.needsUpdate=true};
  screens.push(draw);draw();return tex}
const labels=[];
function labelSprite(text,color='#22D3EE',sub=''){
  const c=mkCanvas(256,96),g=c.getContext('2d');const tex=new THREE.CanvasTexture(c);
  const draw=()=>{g.clearRect(0,0,256,96);g.fillStyle='rgba(5,9,18,.75)';g.beginPath();g.roundRect?g.roundRect(8,8,240,80,14):g.rect(8,8,240,80);g.fill();g.strokeStyle=color;g.lineWidth=2;g.stroke();

  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false}));sp.scale.set(3.2,1.2,1);return sp}
if(document.fonts){Promise.all(['300 16px Prompt','400 12px Prompt','600 24px Prompt'].map(f=>document.fonts.load(f))).then(()=>{labels.forEach(d=>d());screens.forEach(d=>d())}).catch(()=>{});

  box(2.6,.08,1.2,matDesk,0,1.2,0,g);box(.08,1.2,1.1,matDark,-1.2,.6,0,g);box(.08,1.2,1.1,matDark,1.2,.6,0,g);

/* ---------- characters ---------- */
const people=[];
function person(o){const g=new THREE.Group();const c=o.color;const isAI=o.ai;
  const skin=new THREE.MeshStandardMaterial({color:isAI?c:0xE8C4A0,emissive:isAI?c:0x000000,emissiveIntensity:isAI?.5:0,roughness:.6,transparent:isAI,opacity:isAI?.85:1});

  const body=new THREE.Mesh(THREE.CapsuleGeometry?new THREE.CapsuleGeometry(.28,.55,4,10):new THREE.CylinderGeometry(.28,.28,.9,12),cloth);body.position.y=1.0;body.castShadow=true;g.add(body);
  const head=new THREE.Mesh(new THREE.SphereGeometry(.24,18,18),skin);head.position.y=1.72;head.castShadow=true;g.add(head);

  else{const hair=new THREE.Mesh(new THREE.SphereGeometry(.25,18,18,0,Math.PI*2,0,Math.PI/2.2),new THREE.MeshStandardMaterial({color:o.hair||0x1A1410}));hair.position.y=1.76;g.add(hair);}
  for(const s of[-1,1]){const arm=new THREE.Mesh(new THREE.CylinderGeometry(.07,.07,.55,8),cloth);arm.position.set(s*.36,1.05,.1);arm.rotation.z=s*.25;arm.rotation.x=-.9;g.add(arm);(g.userData.arms=g.userData.arms||[]).push(arm)}
  g.position.set(o.x,o.sit?-.45:0,o.z);g.rotation.y=o.ry||0;

/* ================= ZONE 1: DEV FLOOR (left) ================= */
